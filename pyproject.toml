[project]
name = "azure-function-ia"
version = "0.1.0"
description = "Azure function com IA"
authors = [
    {name = "Jules"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-functions (==1.21.3)",
    "openai (>=3.20.0,<4.0.0)",
    "cachetools (>=7.2.0,<8.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-mock (>=3.16.0,<4.0.0)"
]
